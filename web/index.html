<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Glowline · a light puzzle</title>
		<meta name="description" content="A calm garden puzzle at dusk: turn the vines to carry light from the sun to every paper lantern. 40 levels and a new puzzle every day. Made with Godot.">
		<meta name="theme-color" content="#1f1629">
		<meta name="color-scheme" content="dark">
		<link rel="icon" href="index.icon.png" type="image/png">
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #fbefe0;
	background-color: #1f1629;
	overflow: hidden;
	touch-action: none;
	font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 18px;
	background: radial-gradient(circle at 50% 42%, #4a2c45 0, #1f1629 65%);
	padding: 24px;
	text-align: center;
}

#status svg {
	width: 112px;
	height: 112px;
	filter: drop-shadow(0 0 28px rgb(255 190 100 / 0.4));
}

#status h1 {
	margin: 0;
	font-size: 34px;
	letter-spacing: -0.01em;
}

#status-text {
	margin: 0;
	color: #e0cbbd;
	font-size: 15px;
	min-height: 1.4em;
}

#status-bar {
	width: min(280px, 70vw);
	height: 6px;
	border-radius: 3px;
	background: #3d2c45;
	overflow: hidden;
}

#status-fill {
	height: 100%;
	width: 8%;
	border-radius: 3px;
	background: #f6b85e;
	transition: width 0.2s ease-out;
}

#status-notice {
	display: none;
	max-width: 440px;
	padding: 14px 16px;
	border-radius: 12px;
	background: #4a1f2a;
	color: #ffd9dd;
	line-height: 1.4;
}

/* Read by screen readers only: the game draws on a canvas, so it reports the board here. */
.visually-hidden {
	position: absolute;
	width: 1px;
	height: 1px;
	margin: -1px;
	padding: 0;
	border: 0;
	overflow: hidden;
	clip-path: inset(50%);
	white-space: nowrap;
}

@media (prefers-reduced-motion: reduce) {
	#status-fill {
		transition: none;
	}
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas" aria-label="Glowline game">
			Glowline needs a browser that can draw on a canvas.
		</canvas>

		<noscript>
			<p style="padding:24px">Glowline needs JavaScript to run.</p>
		</noscript>

		<div id="status">
			<svg viewBox="0 0 64 64" aria-hidden="true">
			  <defs>
			    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
			      <stop offset="0" stop-color="#2a1b35"/>
			      <stop offset="0.62" stop-color="#6a3a52"/>
			      <stop offset="1" stop-color="#d98b5f"/>
			    </linearGradient>
			    <radialGradient id="glow">
			      <stop offset="0" stop-color="#ffcf7a" stop-opacity="0.7"/>
			      <stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
			    </radialGradient>
			  </defs>
			  <circle cx="32" cy="32" r="25.6" fill="url(#dusk)"/>
			  <circle cx="32" cy="37" r="15" fill="url(#glow)"/>
			  <path d="M12.5 24C21 14.5 40 13.5 51.5 20" fill="none" stroke="#3e2d26" stroke-width="4.6" stroke-linecap="round"/>
			  <path d="M12.5 24C21 14.5 40 13.5 51.5 20" fill="none" stroke="#7f9b57" stroke-width="2.6" stroke-linecap="round"/>
			  <path d="M20 18.2c-1.5-3.6.6-6.2 4.4-6.4.6 3.6-1.4 6-4.4 6.4z" fill="#a3c96f"/>
			  <path d="M42.5 16.6c2.4-3 5.6-2.8 7.6.2-2.6 2.4-5.6 2.4-7.6-.2z" fill="#a3c96f"/>
			  <path d="M32 16.2V24" stroke="#3a2420" stroke-width="1.6" stroke-linecap="round"/>
			  <rect x="27" y="23.4" width="10" height="3" rx="1" fill="#3a2420"/>
			  <ellipse cx="32" cy="36" rx="9" ry="10.2" fill="#ffad4a"/>
			  <ellipse cx="30" cy="34" rx="3.2" ry="5.4" fill="#ffe3a6" opacity="0.85"/>
			  <ellipse cx="32" cy="36" rx="4.4" ry="10.2" fill="none" stroke="#e0832c" stroke-width="1.2"/>
			  <path d="M32 25.8v20.4" stroke="#e0832c" stroke-width="1.2"/>
			  <rect x="28" y="45.4" width="8" height="2.6" rx="1" fill="#3a2420"/>
			  <path d="M32 48v4" stroke="#3a2420" stroke-width="1.6" stroke-linecap="round"/>
			</svg>
			<h1>Glowline</h1>
			<div id="status-bar" role="progressbar" aria-label="Loading Glowline" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="status-fill"></div></div>
			<p id="status-text" aria-live="polite">Loading the game…</p>
			<div id="status-notice" role="alert"></div>
		</div>

		<div id="announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":67196,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

// The game calls this (through JavaScriptBridge) with lines such as "Level 4 · 3 of 5 lanterns lit · 7 moves".
window.glowlineAnnounce = function (text) {
	document.getElementById('announcer').textContent = String(text);
};

(function () {
	const statusOverlay = document.getElementById('status');
	const statusBar = document.getElementById('status-bar');
	const statusFill = document.getElementById('status-fill');
	const statusText = document.getElementById('status-text');
	const statusNotice = document.getElementById('status-notice');

	function fail(err) {
		console.error(err);
		const message = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'Something went wrong.');
		statusNotice.textContent = 'Glowline could not start: ' + message + ' Reload the page to try again.';
		statusNotice.style.display = 'block';
		statusBar.style.display = 'none';
		statusText.textContent = '';
	}

	const missing = Engine.getMissingFeatures({threads: GODOT_THREADS_ENABLED});
	if (missing.length !== 0) {
		fail('this browser lacks ' + missing.join(', ') + '.');
		return;
	}

	let lastPercent = -1;
	engine.startGame({
		onProgress: function (current, total) {
			if (current > 0 && total > 0) {
				const percent = Math.min(100, Math.round((current / total) * 100));
				statusFill.style.width = Math.max(8, percent) + '%';
				statusBar.setAttribute('aria-valuenow', String(percent));
				if (percent !== lastPercent && percent % 10 === 0) {
					statusText.textContent = percent < 100 ? 'Loading the game… ' + percent + '%' : 'Starting…';
					lastPercent = percent;
				}
			}
		},
	}).then(function () {
		statusOverlay.remove();
		document.title = 'Glowline · a light puzzle';
	}, fail);
}());
		</script>
	</body>
</html>
